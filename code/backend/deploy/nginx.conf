# Tome Agent 反向代理示例
# 1) 把 server_name 换成你的域名
# 2) 用 certbot 申请证书：certbot --nginx -d tome.example.com
# 3) 生成 Basic Auth：htpasswd -c /etc/nginx/.htpasswd 你的用户名
# 4) 后端启动时设置 TOME_ALLOWED_HOSTS=tome.example.com（本文件把真实 Host 透传给后端）

server {
    listen 80;
    server_name tome.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tome.example.com;

    ssl_certificate     /etc/letsencrypt/live/tome.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tome.example.com/privkey.pem;

    # 该应用本身没有账号体系，暴露到公网前务必加一层鉴权
    auth_basic "Tome";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        # 透传真实域名，后端会按 TOME_ALLOWED_HOSTS 校验
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
