[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tome-inf-agent"
version = "0.3.0"
description = "INF four-role long-form fiction agent"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.3", "langgraph==1.2.17"]

[tool.setuptools.packages.find]
include = ["inf_backend*"]

[tool.setuptools.package-data]
inf_backend = ["schema.sql"]
