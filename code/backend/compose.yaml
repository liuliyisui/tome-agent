services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tome
      POSTGRES_USER: tome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in code/backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tome_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tome -d tome"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  tome_postgres:
