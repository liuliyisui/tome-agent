<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tome · 故事工作室</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/vue.runtime.global.prod.js" defer></script>
    <script src="/vue-components.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="tome-app"><p class="muted">正在打开故事工作室…</p></div>
    <!-- Source template, precompiled by build-vue.cjs. Never compiled in the browser. -->
    <template id="tome-template">
      <div
        v-show="!state.restoringNavigation"
        :class="{'home-view':state.view==='home','sidebar-collapsed':sidebarHidden}"
        @click="state.menuId=$event.target.closest('.book-menu')?state.menuId:null"
        @keydown.esc="state.menuId=null"
      >
        <aside
          id="workspace-sidebar"
          class="sidebar"
          :inert="sidebarHidden"
          :aria-hidden="sidebarHidden"
        >
          <a class="brand" href="/" aria-label="Tome 首页" @click.prevent="showHome"
            ><span class="brand-icon">T</span>tome<span class="brand-dot"
              >.</span
            ></a
          >
          <div class="workspace-label">你的故事工作室 <span>LOCAL</span></div>
          <button id="new-book" class="primary wide" @click="openCreate">
            <span>＋</span> 开始一个新故事
          </button>
          <div class="library-heading">
            作品书架 <span id="book-count">{{state.books.length}}</span>
          </div>
          <nav id="book-list" aria-label="作品列表">
            <div
              v-for="book in state.books"
              :key="book.id"
              class="book-row"
              :class="{selected:id===book.id}"
            >
              <button
                class="book-item"
                :data-book="book.id"
                :aria-current="id===book.id ? 'page' : undefined"
                :disabled="state.pending.has(book.id)"
                @click="selectBook(book.id)"
              >
                <span class="mini-book" aria-hidden="true"><img v-if="book.cover_version" :src="`${bookUrl(book.id)}/cover?v=${book.cover_version}`" alt="" /><svg v-else class="cover-placeholder" viewBox="0 0 24 32" aria-hidden="true"><path d="M5 2h15a2 2 0 0 1 2 2v25H5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3Z"></path><path d="M7 2v22M22 24H5a3 3 0 0 0 0 6h17M11 9h7M11 13h5"></path></svg></span
                ><span
                  ><strong>{{titleOf(book)}}</strong
                  ><small
                    ><span v-if="book.pinned" class="pin-mark">置顶 · </span
                    >{{book.error || `${book.chapters} / ${book.metadata.target_chapters} 章`}}</small
                  ></span
                >
              </button>
              <details class="book-menu" :open="state.menuId===book.id">
                <summary
                  :aria-label="`管理《${titleOf(book)}》`"
                  title="管理作品"
                  :id="`book-menu-trigger-${book.id}`"
                  :aria-expanded="state.menuId===book.id"
                  :aria-controls="`book-actions-${book.id}`"
                  @click.prevent="state.menuId=state.menuId===book.id?null:book.id"
                >
                  ⋯
                </summary>
                <teleport to="body">
                <div v-if="state.menuId===book.id" class="book-menu-options" :id="`book-actions-${book.id}`" popover="manual" role="group" v-floating-menu="{anchorId:`book-menu-trigger-${book.id}`,close:closeBookMenu}" :aria-label="`管理《${titleOf(book)}》`">
                  <button
                    type="button"
                    :data-pin="book.id"
                    :disabled="state.pending.has(book.id)"
                    @click="pinBook(book)"
                  >
                    {{book.pinned?'取消置顶':'置顶'}}</button
                  ><button
                    type="button"
                    class="danger-text"
                    :data-delete="book.id"
                    :disabled="state.pending.has(book.id)"
                    @click="requestDelete(book)"
                  >
                    删除作品
                  </button>
                </div>
                </teleport>
              </details>
            </div>
            <p v-if="!state.books.length" class="empty-library">
              书架还是空的。<br />为第一个故事留个位置吧。
            </p>
          </nav>
          <button
            id="trash-open"
            class="trash-entry"
            type="button"
            aria-haspopup="dialog"
            aria-controls="trash-dialog"
            @click="openTrash"
          >
            <span aria-hidden="true">▱</span><span>废案箱</span
            ><span id="trash-count" class="trash-count"
              >{{state.trash.length}}</span
            >
          </button>
          <div class="sidebar-bottom">
            <div class="connection">
              <i
                id="connection-dot"
                :class="{ready:state.configured&&!state.connectionError}"
              ></i
              ><span id="connection-text">{{connectionText}}</span>
            </div>
            <p>让灵感成书，让故事延续。</p>
            <span class="version">TOME AGENT / INF ENGINE</span>
          </div>
        </aside>
        <main>
          <header>
            <div class="header-navigation">
              <button
                id="sidebar-toggle"
                v-show="state.view!=='home'"
                type="button"
                class="sidebar-toggle"
                :aria-label="sidebarHidden?'展开侧栏':'收起侧栏'"
                :title="sidebarHidden?'展开侧栏':'收起侧栏'"
                aria-controls="workspace-sidebar"
                :aria-expanded="!sidebarHidden"
                @click="toggleSidebar"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                  <path d="M9 4v16"></path>
                  <path class="sidebar-chevron" d="m15 9-3 3 3 3"></path>
                </svg>
              </button>
              <nav class="breadcrumb" aria-label="页面导航">
                <a id="workspace-home" href="/" title="刷新并返回首页">工作室</a
                ><span aria-hidden="true">/</span
                ><span id="breadcrumb-title" aria-current="page"
                  >{{breadcrumb}}</span
                >
              </nav>
            </div>
            <div class="header-actions">
              <button id="open-settings" class="outline settings-button" type="button" @click="state.dialogs.settings=true" aria-haspopup="dialog" aria-controls="settings-dialog">设置</button>
            <button
              id="my-works"
              class="my-works-button"
              type="button"
              @click="showLibrary"
            >
              我的作品 ↗
            </button>
            </div>
          </header>
          <div class="content">
            <section class="intro" v-show="state.view !== 'book'">
              <div>
                <div class="eyebrow">A SPACE FOR YOUR NEXT CHAPTER</div>
                <h1>每一个世界，都始于一个念头<span>。</span></h1>
                <p>把故事交给灵感，把连续性交给 Tome。</p>
              </div>
              <span class="intro-mark" aria-hidden="true">✳</span>
            </section>
            <div
              id="notice"
              ref="noticePanel"
              class="notice status-message"
              :class="`message-${state.noticeType}`"
              :role="['error','danger'].includes(state.noticeType)?'alert':'status'"
              v-show="state.notice"
            >
              <strong class="message-label">{{messageLabels[state.noticeType]}}</strong><span>{{state.notice}}</span>
            </div>
            <section id="welcome" class="welcome" v-show="state.view==='home'">
              <div class="welcome-art" aria-hidden="true">
                <span class="orbit one"></span><span class="orbit two"></span
                ><span class="book-scene"><span class="book-art"
                  ><span class="book-pages"><span class="book-page-title">故事继续</span><span class="book-page-text">窗外天色渐明。<br />新的旅程，<br />正等待着她。</span></span
                  ><span class="book-leaf book-leaf-first"><span class="book-leaf-front">窗外的雨落下来，<br />一封信静静地躺在桌上。</span><span class="book-leaf-back">她打开信，<br />读到了一个久违的名字。</span></span
                  ><span class="book-leaf book-leaf-second"><span class="book-leaf-front">故事的下一页，<br />从一个选择开始。</span><span class="book-leaf-back">每一次启程，<br />都有未写完的故事。</span></span
                  ><span class="book-cover"><span class="book-cover-front">T<span>THE UNTOLD<br />STORIES</span></span><span class="book-cover-inside"></span></span></span></span
                ><span class="spark">✧</span>
              </div>
              <div class="welcome-copy">
                <div class="eyebrow">从这里，写向远方</div>
                <h2>你的下一部作品<br />正在等待第一章。</h2>
                <p>
                  从一个构想到完整长篇。事件规划、正文写作与三层记忆，让故事持续向前。
                </p>
                <div class="welcome-actions">
                  <button
                    id="welcome-create"
                    class="primary"
                    @click="openCreate"
                  >
                    {{state.configured?'创建新的作品':'配置 API Key'}}
                    <span>↗</span>
                  </button>
                </div>
                <small
                  >{{state.configured?'创作引擎已就绪，开始你的下一个故事。':'配置模型服务后，即可开始创作。'}}</small
                >
              </div>
            </section>
            <section
              id="works-view"
              v-show="state.view==='library'"
              aria-labelledby="works-title"
            >
              <div class="book-heading">
                <div>
                  <div class="eyebrow">YOUR STORY COLLECTION</div>
                  <h2 id="works-title">我的作品</h2>
                </div>
                <button
                  id="works-create"
                  type="button"
                  class="outline"
                  @click="openCreate"
                >
                  ＋ 创建新的作品
                </button>
              </div>
              <p class="muted">从书架选择一部作品，继续你的故事。</p>
              <div id="works-grid" class="works-grid">
                <button
                  v-for="book in state.books"
                  :key="book.id"
                  class="work-card"
                  type="button"
                  :disabled="state.pending.has(book.id)"
                  @click="selectBook(book.id)"
                >
                  <span class="work-card-cover" aria-hidden="true"><img v-if="book.cover_version" :src="`${bookUrl(book.id)}/cover?v=${book.cover_version}`" alt="" /><svg v-else class="cover-placeholder" viewBox="0 0 24 32" aria-hidden="true"><path d="M5 2h15a2 2 0 0 1 2 2v25H5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3Z"></path><path d="M7 2v22M22 24H5a3 3 0 0 0 0 6h17M11 9h7M11 13h5"></path></svg></span><span class="work-card-info"
                    ><strong>{{titleOf(book)}}</strong
                    ><small
                      >{{book.error || `${book.chapters} / ${book.metadata.target_chapters} 章`}}</small
                    ><span class="work-card-open">继续创作 ↗</span></span
                  >
                </button>
                <div v-if="!state.books.length" class="works-empty">
                  <h3>书架还是空的</h3>
                  <p>创建一部新作品，让故事从这里开始。</p>
                </div>
              </div>
            </section>
            <section
              id="book-workspace"
              v-if="state.current"
              v-show="state.view==='book'"
            >
              <div class="book-heading">
                <div>
                  <h2 id="book-title">{{meta.title}}</h2>
                </div>
                <div class="book-actions">
                  <label class="outline cover-upload">
                    {{state.busy.cover?'正在保存…':state.current.cover_version?'更换封面':'上传封面'}}
                    <input type="file" accept="image/png,image/jpeg,image/webp" :disabled="state.busy.cover" @change="uploadCover" />
                  </label>
                <a
                  id="export"
                  class="outline"
                  :href="`/api/books/${encodeURIComponent(id)}/export`"
                  download
                  @click.prevent="reviewForExport"
                  :aria-disabled="state.busy.review||Boolean(state.editor)"
                  >{{state.busy.review ? '正在复查…' : '↓ 复查并导出'}}</a
                >
                </div>
              </div>
              <details class="book-search panel">
                <summary>全书搜索 <span>查找人物、线索或原文</span></summary>
                <form class="book-search-form" role="search" @submit.prevent="submitBookSearch">
                  <label for="book-search-query">搜索《{{meta.title}}》的全部已保存章节</label>
                  <div class="book-search-controls">
                    <input id="book-search-query" type="search" v-model="state.searchQuery" maxlength="200" placeholder="输入关键词，按 Enter 搜索" />
                    <button type="submit" class="primary" :disabled="!state.searchQuery.trim()">搜索</button>
                    <button type="button" class="outline" @click="clearBookSearch" :disabled="!state.searchQuery&&!state.searchTerm">清空</button>
                  </div>
                </form>
                <p class="search-summary muted" role="status" v-if="state.searchTerm">
                  “{{state.searchTerm}}” · {{searchResults.total}} 处匹配<span v-if="searchResults.total>100">，展示前 100 处，请缩小搜索范围</span>
                  <span v-if="state.searchQuery.trim()!==state.searchTerm"> · 输入已更改，按 Enter 重新搜索</span>
                </p>
                <div class="book-search-results" v-if="state.searchTerm" aria-label="全书搜索结果">
                  <button v-for="(item,index) in searchResults.items" :key="index" class="search-result" type="button" @click="jumpToSearch(item)">
                    <strong>第 {{item.number}} 章 · {{item.title}} <small>{{item.field==='title'?'标题':'正文'}}</small></strong>
                    <span>{{item.before}}<mark>{{item.match}}</mark>{{item.after}}</span>
                  </button>
                  <p v-if="!searchResults.total" class="muted">没有找到匹配文字，试试更短的关键词。</p>
                </div>
              </details>
              <div class="stats">
                <div>
                  <span>已完成章节</span
                  ><strong id="stat-chapters"
                    >{{chapters.length}} / {{meta.target_chapters}}</strong
                  >
                </div>
                <div>
                  <span>累计字数</span
                  ><strong id="stat-units">{{fmt(units)}}</strong>
                </div>
                <div>
                  <span>故事记忆</span
                  ><strong id="stat-facts">{{facts.length}}</strong>
                </div>
                <div>
                  <span>创作进度</span
                  ><strong id="stat-progress"
                    >{{Math.round(chapters.length/meta.target_chapters*100)}}%</strong
                  >
                </div>
              </div>
              <details
                class="panel style-panel"
                aria-labelledby="style-heading"
              >
                <summary class="panel-heading">
                  <h3 id="style-heading">文风设定 <span class="settings-disclosure-arrow" aria-hidden="true">▸</span></h3>
                </summary>
                <p class="muted">
                  为这部作品固定叙述方式。保存后从下一章生效，已生成的正文保留原样。
                </p>
                <form id="style-form" @submit.prevent="submitStyle">
                  <div class="style-fields">
                    <label
                      >文风要求<textarea
                        id="style-instructions"
                        name="instructions"
                        rows="5"
                        maxlength="2000"
                        v-model="style.instructions"
                        :disabled="running||state.busy.style"
                        @input="state.errors.style=''"
                        placeholder="例如：第三人称，短句为主，叙述克制；通过动作和对白展现情绪。避免堆砌比喻、重复心理描写和章末说教。"
                      ></textarea
                      ><small
                        >建议 50～300 字，可描述视角、句式、节奏和希望避免的写法。
                        已输入 {{style.instructions.length}} / 2,000 字符。</small
                      ></label
                    ><label
                      >参考片段<textarea
                        id="style-reference"
                        name="reference"
                        rows="5"
                        maxlength="6000"
                        v-model="style.reference"
                        :disabled="running||state.busy.style"
                        @input="state.errors.style=''"
                        placeholder="粘贴你自己写的或有权使用的片段，仅作写法参考。"
                      ></textarea
                      ><small
                        >建议 1,000～3,000 字，仅作写法参考。
                        已输入 {{style.reference.length}} / 6,000 字符。</small
                      ></label
                    >
                  </div>
                  <div class="style-actions">
                    <span
                      id="style-status"
                      role="status"
                      :class="{error:state.errors.style}"
                      >{{styleStatus}}</span
                    ><button
                      id="style-save"
                      class="outline"
                      type="submit"
                      :disabled="running||state.busy.style"
                    >
                      保存文风设定
                    </button>
                  </div>
                </form>
              </details>
              <details class="panel style-panel" aria-labelledby="skills-heading">
                <summary class="panel-heading"><h3 id="skills-heading">写作 Skill <span class="settings-disclosure-arrow" aria-hidden="true">▸</span></h3></summary>
                <p class="muted">导入 SKILL.md，为当前作品选择最多 5 个技能。技能文本用于指导正文写作，不执行其中的脚本或工具。</p>
                <label>安装技能文件 <input type="file" accept=".md,text/markdown,text/plain" @change="installSkill" :disabled="running" /></label>
                <div @change="selectSkills">
                  <p v-if="!state.skills.length" class="muted">尚未安装技能。</p>
                  <label v-for="skill in state.skills" :key="skill.id" class="skill-option">
                    <input type="checkbox" :value="skill.id" :checked="(state.current.skills || []).includes(skill.id)" :disabled="running" /> {{skill.name}}
                  </label>
                </div>
              </details>
              <div class="writing-grid">
                <section class="manuscript panel">
                  <div class="panel-heading">
                    <h3>故事正文</h3>
                    <div class="manuscript-actions">
                      <span id="revision">存档版本 {{state.current.state.revision}}<span v-if="chapter?.author_edited"> · 本地修订稿</span></span>
                      <button v-if="chapter&&!state.editor" id="edit-chapter" class="outline" type="button" :disabled="running" @click="openEditor()">本地修改</button>
                    </div>
                  </div>
                  <div id="chapter-tabs" class="chapter-picker" v-if="chapters.length" aria-label="章节导航">
                    <button type="button" class="chapter-step" :disabled="state.chapterIndex===0||Boolean(state.editor)" @click="turnChapter(-1)" aria-label="上一章">← 上一章</button>
                    <button id="chapter-picker-trigger" type="button" class="chapter-picker-trigger" :disabled="Boolean(state.editor)"
                      :aria-expanded="state.chapterPickerOpen" aria-controls="chapter-directory" @click="toggleChapterPicker">
                      <span><strong>第 {{chapter.number}} 章 · {{chapter.title}}</strong></span>
                      <svg class="chapter-picker-chevron" aria-hidden="true" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5.5 7.5 4.5 4.5 4.5-4.5" /></svg>
                    </button>
                    <button type="button" class="chapter-step" :disabled="state.chapterIndex>=chapters.length-1||Boolean(state.editor)" @click="turnChapter(1)" aria-label="下一章">下一章 →</button>
                  </div>
                  <teleport to="body">
                    <div id="chapter-directory" v-if="state.chapterPickerOpen" class="chapter-directory" popover="manual"
                      role="region" aria-label="章节目录" v-floating-menu="{anchorId:'chapter-picker-trigger',close:closeChapterPicker,matchAnchorWidth:true}">
                      <label for="chapter-filter">跳转章节 <span>{{chapters.length}} 章</span></label>
                      <input id="chapter-filter" type="search" v-model="state.chapterFilter" placeholder="输入章号或章节名称" maxlength="100" @keydown.down.prevent="$event.target.parentElement.querySelector('.chapter-directory-list button')?.focus()" />
                      <div class="chapter-directory-list">
                        <button v-for="item in filteredChapters" :key="item.number" type="button"
                          :class="{current:item.index===state.chapterIndex}" :aria-current="item.index===state.chapterIndex?'location':undefined"
                          @click="chooseChapter(item.index)">
                          <span class="chapter-number">第 {{item.number}} 章</span><span class="chapter-name">{{item.title}}</span><small v-if="item.index===state.chapterIndex">正在阅读</small>
                        </button>
                        <p v-if="!filteredChapters.length" class="muted">没有找到这个章节。</p>
                      </div>
                    </div>
                  </teleport>
                  <teleport to="body">
                    <div v-if="state.editor" class="editor-workspace" role="dialog" aria-modal="true" aria-labelledby="editor-workspace-title">
                      <header class="editor-bar">
                        <div class="editor-bar-title">
                          <span class="editor-kicker">本地修改</span>
                          <h2 id="editor-workspace-title">第 {{state.editor.number}} 章 · 写作工作台</h2>
                        </div>
                        <div class="editor-bar-actions">
                          <button type="button" class="text-button" :disabled="state.busy.edit||state.busy.proofread" @click="discardDraft">丢弃草稿</button>
                          <button type="button" class="outline" :disabled="state.busy.edit||state.busy.proofread" @click="proofreadDraft">{{state.busy.proofread?'复查中…':'本地复查'}}</button>
                          <button type="button" class="outline" :disabled="state.busy.edit||state.busy.proofread" @click="closeEditor">收起，保留草稿</button>
                          <button type="submit" form="chapter-editor" class="primary" :disabled="state.busy.edit||state.busy.proofread||state.editor.report?.blocked||(state.editor.report?.total&&!state.editor.acknowledged)">{{state.busy.edit?'正在保存并同步…':'复查并保存'}}</button>
                        </div>
                      </header>
                      <div class="editor-scroll">
                        <div class="editor-layout">
                          <form id="chapter-editor" class="editor-main" @submit.prevent="saveEditedChapter">
                            <p class="form-hint">保存后会同步正文与记忆，后续续写使用新稿；原稿存档会保留，不额外调用模型。改动剧情后请核对后续章节的一致性。</p>
                            <label for="chapter-edit-title">章节标题</label>
                            <input id="chapter-edit-title" v-model="state.editor.title" maxlength="100" required :disabled="state.busy.edit||state.busy.proofread" />
                            <label for="chapter-edit-text">正文</label>
                            <textarea id="chapter-edit-text" v-model="state.editor.text" rows="12" maxlength="200000" required :disabled="state.busy.edit||state.busy.proofread" spellcheck="false"></textarea>
                            <p class="form-hint" role="status">{{state.draftStatus}}</p>
                          </form>
                          <aside class="editor-side">
                            <proofreading-results :report="state.editor.report" :editable="true" v-model:acknowledged="state.editor.acknowledged" @locate="locateFinding" @apply="applyProofreading"></proofreading-results>
                            <p class="error" role="alert" v-if="state.editError">{{state.editError}}</p>
                            <div class="editor-tips">
                              <h4>提交前检查</h4>
                              <ul>
                                <li>标题与正文一起保存，原稿存档保留。</li>
                                <li>改动剧情后，后续章节的事件与记忆可能不再匹配。</li>

                <span>预计输入 token</span
                ><strong id="estimate-input"
                  >{{fmt(state.estimate.input_tokens)}}</strong
                >
              </div>
              <div>
                <span>预计输出 token</span
                ><strong id="estimate-output"
                  >{{fmt(state.estimate.output_tokens)}}</strong
                >
              </div>
              <div>
                <span>预计 token 合计</span
                ><strong id="estimate-total"
                  >≈ {{fmt(state.estimate.total_tokens)}}</strong
                >
              </div>
            </div>
            <local-safety-review :report="state.estimate.safety" v-model:confirmed="state.privacyConfirmed"></local-safety-review>
            <p id="estimate-basis" class="muted">{{state.estimate.basis}}</p>
            <p class="form-hint">本次使用模型：{{state.estimate.pricing.requested_model}}</p>
            <div class="official-price-panel">
              <strong id="estimate-period"
                >{{state.estimate.pricing.label}} ·
                {{state.estimate.pricing.model}}</strong
              >
              <dl>
                <div>
                  <dt>输入单价（未命中缓存）</dt>
                  <dd id="estimate-input-price">
                    {{price(state.estimate.prices?.input)}}
                  </dd>
                </div>
                <div>
                  <dt>输出单价</dt>
                  <dd id="estimate-output-price">
                    {{price(state.estimate.prices?.output)}}
                  </dd>
                </div>
              </dl>
              <p id="estimate-price-rule">{{state.estimate.pricing.rule}}</p>
              <a
                id="estimate-price-source"
                v-if="state.estimate.pricing.source" :href="state.estimate.pricing.source"
                target="_blank"
                rel="noopener noreferrer"
                >DeepSeek 官方定价 ↗</a
              ><small v-if="state.estimate.pricing.source" id="estimate-price-date"
                >核验：{{state.estimate.pricing.checked_at}}
                {{state.estimate.pricing.status==='live'?'· 官方实时同步':'· 已核验缓存价，联网不可用时使用'}}</small
              >
              <p
                id="estimate-price-warning"
                class="warning status-message message-warning"
                v-show="state.estimate.pricing.warning"
              >
                <strong class="message-label">警告</strong>{{state.estimate.pricing.warning}}
              </p>
            </div>
            <p class="estimate-cost">
              预计费用
              <strong id="estimate-cost"
                >{{cost(state.estimate.estimated_cost_cny)}}</strong
              >
            </p>
            <p
              id="estimate-peak-cost"
              class="form-hint"
              v-show="state.estimate.peak_cost_cny!==null&&state.estimate.pricing.period==='off_peak'"
            >
              若按高峰价计：{{cost(state.estimate.peak_cost_cny)}}
            </p>
            <p id="estimate-note" class="form-hint">
              {{state.estimate.note}}
            </p></template
          >
          <p id="estimate-error" class="error" role="alert">
            {{state.errors.estimate}}
          </p>
          <div class="confirm-actions">
            <button
              id="estimate-cancel"
              type="button"
              class="outline"
              :disabled="state.busy.start"
              @click="closeDialog('estimate')"
            >
              {{Number(state.estimate?.count)>3?'返回调整':'取消'}}</button
            ><button
              id="estimate-continue"
              type="button"
              class="primary"
              :disabled="state.busy.start||!state.estimate||state.estimate.safety?.blocked||(state.estimate.safety?.requires_confirmation&&!state.privacyConfirmed)"
              @click="confirmGeneration"
            >
              继续生成
            </button>
          </div>
        </dialog>
        <dialog
          id="delete-dialog"
          v-dialog="state.dialogs.delete"
          aria-labelledby="delete-title"
          @cancel.prevent="closeDialog('delete')"
        >
          <div class="eyebrow">MANAGE YOUR LIBRARY</div>
          <h2 id="delete-title">删除这部作品？</h2>
          <p id="delete-book-title">《{{titleOf(state.deleteBook)}}》</p>
          <p class="muted">
            作品会移出书架，正文和存档保存在废案箱。删除后可从书架底部的「废案箱」恢复；正在生成的作品需先等待任务结束。
          </p>
          <p id="delete-error" class="error" role="alert">
            {{state.errors.delete}}
          </p>
          <div class="confirm-actions">
            <button
              id="delete-cancel"
              type="button"
              class="outline"
              :disabled="state.busy.delete"
              @click="closeDialog('delete')"
            >
              取消删除</button
            ><button
              id="delete-confirm"
              type="button"
              class="primary danger-button"
              :disabled="state.busy.delete"
              @click="deleteBook"
            >
              删除作品
            </button>
          </div>
        </dialog>
        <dialog
          id="trash-dialog"
          v-dialog="state.dialogs.trash"
          aria-labelledby="trash-title"
          @cancel.prevent="closeDialog('trash')"
        >
          <div class="dialog-heading">
            <div>
              <h2 id="trash-title">废案箱</h2>
            </div>
            <button
              id="trash-close"
              type="button"
              class="icon-button"
              aria-label="关闭废案箱"
              @click="closeDialog('trash')"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
          </div>
          <p class="muted">
            暂时放下的故事，也可以重新开始。作品正文、文风和存档都保留在这里。
          </p>
          <p v-if="state.trashLoading" id="trash-loading" class="muted" role="status">
            {{state.trash.length?'正在更新废案箱…':'正在加载废案箱…'}}
          </p>
          <div v-else-if="state.trashError" class="trash-load-error status-message message-error">
            <span role="alert">废案箱加载失败。{{state.trashError}}</span>
            <button class="outline" type="button" @click="refreshTrash">重试</button>
          </div>
          <div id="trash-list" :aria-busy="state.trashLoading">
            <div
              v-for="book in state.trash"
              :key="book.restore_token"
              class="trash-book"
            >
              <div>
                <strong>{{book.title}}</strong
                ><small>移入时间：{{deletedAt(book.deleted_at)}}</small>
              </div>
              <div class="trash-book-actions">
                <button
                  class="outline"
                  type="button"
                  :data-restore="book.restore_token"
                  :disabled="state.pending.has(book.restore_token)"
                  @click="restoreBook(book)"
                >
                  {{state.pending.has(book.restore_token)?'正在恢复…':'恢复到书架'}}</button
                ><button
                  class="purge-button"
                  type="button"
                  :data-purge="book.restore_token"
                  :disabled="state.pending.has(book.restore_token)"
                  @click="requestPurge(book)"
                >
                  彻底删除
                </button>
              </div>
            </div>
            <div v-if="!state.trash.length&&!state.trashLoading&&!state.trashError" class="trash-empty">
              <span aria-hidden="true">◇</span>
              <h3>废案箱还是空的</h3>
              <p>从书架删除的作品会保存在这里，可随时恢复。</p>
            </div>
          </div>
          <p id="trash-message" role="status" class="muted">
            {{state.trashMessage}}
          </p>
        </dialog>
        <dialog
          id="regenerate-dialog"
          v-dialog="state.dialogs.regenerate"
          aria-labelledby="regenerate-title"
          @cancel.prevent="closeDialog('regenerate')"
        >
          <form v-if="state.regeneration" @submit.prevent="regenerateChapter">
            <h2 id="regenerate-title">重新生成第 {{state.regeneration.number}} 章</h2>
            <p class="muted" v-if="state.regeneration.later">
              新稿保存后会替换本章，后续 {{state.regeneration.later}} 章需要重新续写。
            </p>
            <label for="regenerate-feedback">作者意见（必填）</label>
            <textarea
              id="regenerate-feedback"
              v-model="state.regeneration.feedback"
              @input="state.regeneration.safety=null; state.regeneration.privacyConfirmed=false"
              rows="4"
              required
              maxlength="2000"
              placeholder="例如：保留结尾的线索，减少背景解释，用两人的对话推进冲突。"
              :disabled="state.busy.regenerate"
            ></textarea>
            <local-safety-review :report="state.regeneration.safety" v-model:confirmed="state.regeneration.privacyConfirmed"></local-safety-review>
            <p class="error" role="alert" v-if="state.errors.regenerate">{{state.errors.regenerate}}</p>
            <div class="confirm-actions">
              <button class="outline" type="button" :disabled="state.busy.regenerate" @click="closeDialog('regenerate')">取消</button>
              <button id="regenerate-submit" class="primary" type="submit" :disabled="state.busy.regenerate || running || !state.regeneration.feedback.trim() || state.regeneration.safety?.blocked || (state.regeneration.safety?.requires_confirmation&&!state.regeneration.privacyConfirmed)">
                {{state.busy.regenerate ? '正在提交…' : '按意见重新生成'}}
              </button>
            </div>
          </form>
        </dialog>
        <dialog
          id="purge-dialog"
          v-dialog="state.dialogs.purge"
          aria-labelledby="purge-title"
          @cancel.prevent="closeDialog('purge')"
        >
          <div class="eyebrow">PERMANENT DELETION</div>
          <h2 id="purge-title">彻底删除这部作品？</h2>
          <p id="purge-book-title">《{{titleOf(state.purgeBook)}}》</p>
          <p class="purge-warning status-message message-danger" role="alert">
            <strong class="message-label">危险</strong>将永久删除全部正文、文风设定和存档，无法恢复。
          </p>
          <label for="purge-title-input">输入完整作品名称以确认</label
          ><input
            id="purge-title-input"
            type="text"
            autocomplete="off"
            placeholder="请输入上方作品名称"
            v-model="state.purgeTitle"
            :disabled="state.busy.purge"
          />
          <p id="purge-error" class="error" role="alert">
            {{state.errors.purge}}
          </p>
          <div class="confirm-actions">
            <button
              id="purge-cancel"
              class="outline"
              type="button"
              :disabled="state.busy.purge"
              @click="closeDialog('purge')"
            >
              取消彻底删除</button
            ><button
              id="purge-confirm"
              class="primary danger-button"
              type="button"
              :disabled="state.busy.purge||!state.purgeBook||state.purgeTitle!==state.purgeBook.title"
              @click="purgeBook"
            >
              确认彻底删除
            </button>
          </div>
        </dialog>
      </div>
    </template>
  </body>
</html>
