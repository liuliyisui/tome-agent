# pnpm 10+ 对依赖的 postinstall 脚本默认拦截；这里显式声明策略，保证 CI 里
# `pnpm install --frozen-lockfile` 既不会失败，也不会在构建阶段偷偷下载浏览器。
#
# playwright-chromium 是 @slidev/cli 的 optional peer：只在 `slidev export`（导出 PDF）时用到。
# 它被忽略的构建脚本只负责下载 Chromium，导出前用 `pnpm exec playwright install chromium`
# 显式安装即可（见 .github/workflows/export-slides-pdf.yml）。
# Windows 上用扁平 node_modules（npm 风格），避免 pnpm 软链/junction 在部分环境下
# 导致 ESM 解析不到依赖（ERR_MODULE_NOT_FOUND: pathe）。
nodeLinker: hoisted

# 不自动安装 optional peer：playwright-chromium 只有导出 PDF 才需要，
# 让它在构建阶段缺席，CI 的 `pnpm install --frozen-lockfile` 才能干净通过，
# 也不会在每次部署时下载 150 MB 的 Chromium。
autoInstallPeers: false

ignoredBuiltDependencies:
  - playwright-chromium

# pnpm 11 的供应链策略会拦截刚发布的版本；下列版本已在本地安装验证通过。
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.46'
  - '@vue/compiler-dom@3.5.46'
  - '@vue/compiler-sfc@3.5.46'
  - '@vue/compiler-ssr@3.5.46'
  - '@vue/reactivity@3.5.46'
  - '@vue/runtime-core@3.5.46'
  - '@vue/runtime-dom@3.5.46'
  - '@vue/server-renderer@3.5.46'
  - '@vue/shared@3.5.46'
  - vue@3.5.46
