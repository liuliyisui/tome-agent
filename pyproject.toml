[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tome-agent"
version = "0.1.0"
description = "A chapter-based long-form fiction generation framework"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["tome_agent", "tome_backend", "tome_backend.providers"]
package-dir = {tome_agent = "code/core_engine/tome_agent", tome_backend = "code/backend/tome_backend"}
