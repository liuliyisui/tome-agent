# 用 GitHub Actions 把 Slidev 幻灯片构建并发布到 GitHub Pages
#
# 流程：push（只改幻灯片目录时）→ 安装 pnpm / Node → 装依赖 → slidev build
#       → 上传 Pages artifact → deploy-pages 发布
# 首次使用前，需在仓库 Settings → Pages → Source 选择 “GitHub Actions”。

name: Deploy slides (Slidev)

on:
  push:
    branches: [main, master]
    paths:
      - "slides/slidev/**"
      - ".github/workflows/deploy-slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，避免两次部署互相覆盖
concurrency:
  group: pages-slides
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides/slidev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本要和本地生成 pnpm-lock.yaml 的版本一致，否则 --frozen-lockfile 会报错
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.28.5"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: slides/slidev/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # base 必须是 /<仓库名>/，否则 GitHub Pages 上的静态资源 404
      - name: Build Slidev
        run: pnpm exec slidev build slides.md --out dist --base "/${{ github.event.repository.name }}/"

      # 额外留一份可下载的构建产物，便于排查部署问题
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-dist
          path: slides/slidev/dist
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 时自动开启，省掉手工点 Settings 的步骤；
          # 若组织策略禁止自动开启，仍会失败，需要手动在 Settings → Pages 选 “GitHub Actions”。
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: slides/slidev/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
