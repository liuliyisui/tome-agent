# 用 GitHub Actions 把 Slidev 幻灯片构建并发布到 GitHub Pages
#
# 触发：
#   push 到 main/master 且改动 docs/slides/**  → 构建 + 发布到 Pages
#   Pull Request 改动 docs/slides/**           → 只构建校验，不发布
#   手动 workflow_dispatch                      → 构建 + 发布
#
# 首次使用前需要在仓库 Settings → Pages → Source 选择 “GitHub Actions”（需仓库 owner 操作）。

name: Deploy slides (Slidev)

on:
  push:
    branches: [main, master]
    paths:
      - "docs/slides/**"
      - ".github/workflows/deploy-slides.yml"
  pull_request:
    paths:
      - "docs/slides/**"
      - ".github/workflows/deploy-slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，避免两次部署互相覆盖
concurrency:
  group: pages-slides
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/slides

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本要和本地生成 pnpm-lock.yaml 的版本一致，否则 --frozen-lockfile 会报错
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.28.5"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: docs/slides/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # base 必须是 /<仓库名>/，否则 GitHub Pages 上的静态资源 404
      - name: Build Slidev
        run: pnpm exec slidev build slides.md --out dist --base "/${{ github.event.repository.name }}/"

      # 构建产物自检：入口页存在且引用了正确的 base
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          grep -q "/${{ github.event.repository.name }}/" dist/index.html || { echo "base 未注入"; exit 1; }
          echo "页面数：$(ls dist/*.html | wc -l)"
          du -sh dist

      # 额外留一份可下载的构建产物，便于排查部署问题
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-dist
          path: docs/slides/dist
          retention-days: 7
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/slides/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
