name: Slides / Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/slides/**"
      - ".github/workflows/slides-pages.yml"
  pull_request:
    paths:
      - "docs/slides/**"
      - ".github/workflows/slides-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Slidev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/slides

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/slides/package-lock.json

      - name: Check slide sources
        run: |
          test -f slides.md
          test -f package.json
          test -f package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build slides
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build -- --base "$PAGES_BASE"

      # Keep this check self-contained: it must not depend on optional local scripts.
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -Fq "/${{ github.event.repository.name }}/" dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"
          echo "Build output OK"

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: slides-site
          path: docs/slides/dist
          retention-days: 14

      # enablement: true asks GitHub to create the Pages site when it is missing.
      # If repository policy forbids this, set Settings -> Pages -> Source to
      # "GitHub Actions" once and rerun.
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/slides/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
