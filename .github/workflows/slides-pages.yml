name: Slides / Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/slides/**"
      - ".github/workflows/slides-pages.yml"
  pull_request:
    paths:
      - "docs/slides/**"
      - ".github/workflows/slides-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slides-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Slidev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/slides

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/slides/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build slides
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build -- --base "$PAGES_BASE"

      - name: Verify build output
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run check

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-site
          path: docs/slides/dist
          retention-days: 14

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/slides/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
