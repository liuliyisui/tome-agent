name: Local framework tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}\code\core_engine;${{ github.workspace }}\code\backend
